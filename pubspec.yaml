name: despertador_nautico
description: "Un hermoso despertador náutico con fondos de video personalizados 🦊🍂"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Fondo de video
  video_player: ^2.8.7
  chewie: ^1.7.5

  # Para efectos avanzados con HTML (burbujas/partículas si lo usas)
  webview_flutter: ^4.9.0

  # Formato de fecha/hora en español
  intl: ^0.19.0

  # Zonas horarias para Reloj Mundial
  timezone: ^0.9.2

  # Guardado permanente de ciudades y preferencias
  shared_preferences: ^2.3.0

  # NUEVOS PAQUETES PARA ALARMA PROFESIONAL (versiones actuales 2025)
  android_alarm_manager_plus: ^4.0.3
  just_audio: ^0.9.39
  workmanager: ^0.9.0+3  # ← Versión correcta y actual

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Herramienta para generar íconos automáticamente
  flutter_launcher_icons: ^0.14.4  # ← Versión más reciente (2025)

flutter:
  uses-material-design: true

  assets:
    - assets/html/index.html
    - assets/videos/
    - assets/images/
    - assets/sounds/
    - assets/icon/icon.png  # ← Asegúrate de tener esta imagen (1024x1024)

# Configuración para generar íconos de launcher (Android + iOS)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21