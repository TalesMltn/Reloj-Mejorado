name: despertador_nautico
description: "Un hermoso despertador náutico con fondos de video personalizados 🦊🍂"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Fondo de video
  video_player: ^2.8.7
  chewie: ^1.7.5

  # Para efectos avanzados con HTML (burbujas/partículas si lo usas)
  webview_flutter: ^4.9.0

  # Formato de fecha/hora en español
  intl: ^0.19.0

  # Zonas horarias para Reloj Mundial
  timezone: ^0.9.2

  # Guardado permanente de ciudades y preferencias
  shared_preferences: ^2.3.0

  # Paquetes opcionales futuros para alarma con sonido y notificaciones
  # alarm: ^3.2.0
  # just_audio: ^0.9.39
  # flutter_local_notifications: ^17.2.3
  # permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/html/index.html
    - assets/videos/          # Incluye todos los videos: fox_autumn_1.mp4 a fox_autumn_7.mp4
    - assets/images/          # ← Aquí van bnita1.jpg, bnita2.jpg y bnita3.jpg