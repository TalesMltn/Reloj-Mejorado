<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despertador Náutico - Lista de Alarmas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body, html { height: 100%; overflow: hidden; color: #fff; position: relative; }

        /* Fondo náutico original */
        #video-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -3;
        }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,20,40,0.7), rgba(0,5,30,0.9));
            z-index: -2;
        }

        /* Burbujas náuticas siempre visibles (suben desde abajo) */
        .particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;
        }
        .particle {
            position: absolute;
            background: rgba(0, 255, 255, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.9);
            animation: rise 15s infinite linear;
        }
        @keyframes rise {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-100px) translateX(-50px); opacity: 0; }
        }

        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px; /* Espacio para bottom nav */
        }

        /* Mensaje cuando todas están desactivadas */
        .header {
            padding: 80px 20px 30px;
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            color: #ddd;
        }

        /* Lista de alarmas */
        .alarms-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px;
        }

        .alarm-card {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            border: 1px solid rgba(0,255,255,0.2);
        }

        .alarm-info {
            line-height: 1.4;
        }
        .alarm-time-main {
            font-size: 58px;
            font-weight: 600;
            color: #fff;
        }
        .alarm-am-pm {
            font-size: 28px;
            color: #ccc;
            margin-left: 8px;
        }
        .alarm-sub-time {
            font-size: 38px;
            color: #aaa;
            margin-top: 8px;
        }
        .alarm-icon {
            font-size: 28px;
            margin: 0 8px;
        }
        .alarm-label {
            font-size: 18px;
            color: #ccc;
            margin-top: 10px;
        }
        .alarm-sublabel {
            font-size: 16px;
            color: #999;
            font-style: italic;
        }

        /* Switch estilo iOS/Google */
        .switch {
            position: relative;
            display: inline-block;
            width: 54px;
            height: 34px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 28px;
            width: 28px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #777;
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Botón + grande */
        .fab {
            position: fixed;
            top: 80px;
            right: 30px;
            font-size: 40px;
            color: #00ffff;
            cursor: pointer;
            z-index: 10;
        }
        .more-btn {
            position: fixed;
            top: 80px;
            right: 90px;
            font-size: 32px;
            color: #00ffff;
            cursor: pointer;
            z-index: 10;
        }

        /* Bottom navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(10, 20, 40, 0.6);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid rgba(0,255,255,0.2);
            z-index: 5;
        }
        .nav-item {
            text-align: center;
            color: #888;
            font-size: 15px;
            font-weight: 500;
        }
        .nav-item.active {
            color: #00ffff;
        }
        .nav-item.active::after {
            content: '';
            display: block;
            width: 60%;
            height: 3px;
            background: #00ffff;
            margin: 8px auto 0;
            border-radius: 2px;
        }

        /* Pantalla configuración (igual que antes) */
        .config-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,10,30,0.85); backdrop-filter: blur(15px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20;
        }
        .config-screen.active { display: flex; }
        .glass-panel {
            background: rgba(10, 30, 60, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            width: 90%; max-width: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(0, 255, 255, 0.3);
            text-align: center;
        }
        .back-btn {
            position: absolute; top: 30px; left: 30px; background: rgba(255,255,255,0.1); padding: 10px 15px; border-radius: 50px; font-size: 20px;
        }
    </style>
</head>
<body>
<!-- Fondo oceánico + overlay -->
<video id="video-bg" autoplay muted loop playsinline>
    <source src="https://cdn.pixabay.com/vimeo/283917142/ocean-waves-1920.mp4" type="video/mp4">
</video>
<div id="overlay"></div>

<!-- Burbujas náuticas -->
<div class="particles" id="particles"></div>

<div class="container">
    <!-- Mensaje todas desactivadas -->
    <div class="header">
        Todas las alarmas<br>están desactivadas
    </div>

    <!-- Lista de alarmas -->
    <div class="alarms-list">
        <!-- Alarma 1 -->
        <div class="alarm-card">
            <div class="alarm-info">
                <span class="alarm-time-main">10:00</span>
                <span class="alarm-am-pm">p. m.</span>
                <span class="alarm-icon">🌙</span><br>
                <span class="alarm-sub-time">8:50 a. m.</span>
                <span class="alarm-icon">☀️</span><br>
                <div class="alarm-label">Diariamente</div>
            </div>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <!-- Alarma 2 -->
        <div class="alarm-card">
            <div class="alarm-info">
                <span class="alarm-time-main">9:30</span>
                <span class="alarm-am-pm">a. m.</span><br>
                <div class="alarm-label">mar., 30 dic.</div>
            </div>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <!-- Alarma 3 -->
        <div class="alarm-card">
            <div class="alarm-info">
                <div class="alarm-sublabel">dormir</div>
                <span class="alarm-time-main">2:10</span>
                <span class="alarm-am-pm">p. m.</span><br>
                <div class="alarm-label">lun., 29 dic.</div>
            </div>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>
    </div>
</div>

<!-- Botones + y : -->
<div class="fab" id="add-alarm">+</div>
<div class="more-btn">:</div>

<!-- Bottom navigation -->
<div class="bottom-nav">
    <div class="nav-item active">Alarma</div>
    <div class="nav-item">Reloj Mundial</div>
    <div class="nav-item">Cronómetro</div>
    <div class="nav-item">Temporizador</div>
</div>

<!-- Pantalla configuración (exactamente como antes) -->
<div class="config-screen" id="config-screen">
    <button class="back-btn" id="back-btn">← Volver</button>
    <div class="glass-panel">
        <h2 style="font-size:36px; color:#00ffff; margin-bottom:30px;">Configurar Alarma</h2>
        <label>Hora:</label>
        <input type="time" id="alarm-time" value="07:00">
        <label>Fondo náutico:</label>
        <select id="bg-select">
            <option value="https://cdn.pixabay.com/vimeo/283917142/ocean-waves-1920.mp4" selected>Ocean Waves Profundo (actual)</option>
            <option value="https://cdn.pixabay.com/vimeo/449147078/rain-60758.mp4">Lluvia sobre el mar</option>
            <option value="https://cdn.pixabay.com/vimeo/1029784356/starry-night-3840.mp4">Noche estrellada marina</option>
        </select>
        <label>Sonido:</label>
        <select id="sound-select">
            <option>Olas suaves</option>
            <option>Campanas marinas</option>
            <option>Melodía oceánica</option>
        </select>
        <p>O subir tu audio:</p>
        <input type="file" accept="audio/*">
        <button id="save-config">Guardar</button>
    </div>
</div>

<script>
    // 120 burbujas náuticas
    const particles = document.getElementById('particles');
    for (let i = 0; i < 120; i++) {
        const p = document.createElement('div');
        p.classList.add('particle');
        const size = Math.random() * 8 + 4;
        p.style.width = p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDelay = Math.random() * 20 + 's';
        p.style.animationDuration = 12 + Math.random() * 15 + 's';
        particles.appendChild(p);
    }

    // Abrir configuración con el botón +
    document.getElementById('add-alarm').addEventListener('click', () => {
        document.getElementById('config-screen').classList.add('active');
    });

    // Cambiar fondo
    const video = document.getElementById('video-bg');
    document.getElementById('bg-select').addEventListener('change', (e) => {
        video.querySelector('source').src = e.target.value;
        video.load();
    });

    // Navegación configuración
    document.getElementById('back-btn').addEventListener('click', () => {
        document.getElementById('config-screen').classList.remove('active');
    });
    document.getElementById('save-config').addEventListener('click', () => {
        document.getElementById('config-screen').classList.remove('active');
        alert('¡Alarma náutica configurada!');
    });
</script>
</body>
</html>
